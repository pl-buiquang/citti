name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CITTI_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::CITTI_KEYSTORE_BASE64 secret is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/citti-release.jks"
          echo "CITTI_KEYSTORE_FILE=$RUNNER_TEMP/citti-release.jks" >> "$GITHUB_ENV"
      - name: Lint, test and build the signed release
        env:
          CITTI_KEYSTORE_PASSWORD: ${{ secrets.CITTI_KEYSTORE_PASSWORD }}
          CITTI_KEY_ALIAS: ${{ secrets.CITTI_KEY_ALIAS }}
          CITTI_KEY_PASSWORD: ${{ secrets.CITTI_KEY_PASSWORD }}
        run: ./gradlew spotlessCheck check assembleRelease -PversionName="${GITHUB_REF_NAME#v}"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="citti-${GITHUB_REF_NAME}.apk"
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --title "$GITHUB_REF_NAME" --generate-notes
